<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подтверждение кода</title>

    <style>
        body {
            background: #161e31;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: #2d3250;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h2 {
            color: white;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #4a6cf7;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #3b5bdb;
        }

        .info {
            color: #aaa;
            font-size: 13px;
            margin-top: 10px;
        }

        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Введите код</h2>

    <form method="POST">

        <input type="text"
               name="code"
               maxlength="6"
               placeholder="------"
               required>

        <button type="submit">Подтвердить</button>

    </form>

    <div class="info">
        Мы отправили 6-значный код на вашу почту
    </div>

    <!-- если хочешь показывать ошибки -->
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

</div>

</body>
</html>
