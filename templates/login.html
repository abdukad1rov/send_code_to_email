<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sing.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Войти</title>
</head>
<body>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
<main class="form-signin w-100 m-auto">

    <form method="POST">

        <img class="mb-4 logo" src="{{ url_for('static', filename='img/shop.jpg') }}">

        <h1 class="h3 mb-3 fw-normal">Войти</h1>

        <!-- EMAIL -->
        <div class="form-floating">
            <input type="email"
                   class="form-control"
                   id="floatingInput"
                   name="email"
                   placeholder="name@example.com"
                   required>

            <label for="floatingInput">Email</label>
        </div>

        <!-- PASSWORD -->
        <div class="form-floating">
            <input type="password"
                   class="form-control"
                   id="floatingPassword"
                   name="password"
                   placeholder="Password"
                   required>

            <label for="floatingPassword">Пароль</label>
        </div>

        <!-- REMEMBER -->
        <div class="form-check text-start my-3">
            <input class="form-check-input"
                   type="checkbox"
                   value="remember-me"
                   id="checkDefault">

            <label class="form-check-label" for="checkDefault">
                Запомнить меня
            </label>
        </div>

        <!-- BUTTON -->
        <button class="btn btn-primary w-100 py-2" type="submit">
            Войти
        </button>

        <p class="mt-5 mb-3 text-body-secondary">© 2025–2026</p>

    </form>

</main>
<script src="/docs/5.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        class="astro-vvvwv3sm"></script>
</body>
</body>
</html>
